# Single app container + external Mongo (Atlas / shared VPS Mongo)
# Use this when MONGODB_URI points outside compose network.
#
# Required env (Dokploy env UI or .env):
#   MONGODB_URI=.../niche-daily...
#   AUTHORIZED_PHONE=628...
#   API_KEY=...
#   CAMOFOX_URL=http://camofox:9377 (jika camofox jalan sebagai container terpisah)

services:
  niche-daily:
    build:
      context: .
      dockerfile: Dockerfile
    image: niche-daily:latest
    restart: unless-stopped
    ports:
      - "${HOST_WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Force docker port layout; other secrets come from env_file / Dokploy injection
      API_PORT: 4000
      PORT: 4000
      WEB_PORT: 3000
      WHATSAPP_AUTH_DIR: /app/whatsapp_auth
      # Camofox pass-through (Dokploy Environment → compose → container)
      CAMOFOX_URL: ${CAMOFOX_URL:-http://camofox:9377}
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-}
      CAMOFOX_TIMEOUT_MS: ${CAMOFOX_TIMEOUT_MS:-45000}
    volumes:
      - niche_wa_auth:/app/whatsapp_auth

volumes:
  niche_wa_auth:
